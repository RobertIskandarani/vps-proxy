name: proxy

# Reverse proxy central y neutral del VPS. No pertenece a ninguna app: cada app
# se une a la red externa `edge` y este Caddy la rutea por dominio (TLS auto).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
